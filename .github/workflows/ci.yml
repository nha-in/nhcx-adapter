name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Vet and race tests. Every release target is compiled by build below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # git describe needs the tags
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make check

  # One job per platform, each uploading its own archive (Actions → run →
  # Artifacts → nhcx-adapter_<os>_<arch>). On a vX.Y.Z tag the release job
  # below collects them all. Keep this list in step with DEFAULT_TARGETS in
  # scripts/build.sh.
  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm
          - linux/386
          - linux/ppc64le
          - linux/s390x
          - linux/riscv64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
          - windows/386
          - freebsd/amd64
          - freebsd/arm64
    name: build (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Package
        id: pkg
        run: |
          ./scripts/build.sh "${{ matrix.target }}"
          echo "name=nhcx-adapter_$(tr / _ <<<'${{ matrix.target }}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # Container image for every Linux platform alpine ships. Every run builds
  # it and boots the amd64 one; pushes to ghcr.io go out on main (:main,
  # :sha-…) and on vX.Y.Z tags (:X.Y.Z, :X.Y, :latest). Pull requests build
  # and test only.
  #
  # Pushing needs the repository to be allowed to write the package:
  #   - Org → Settings → Packages: members may create packages, and
  #   - if ghcr.io/<org>/nhcx-adapter already exists: Package settings →
  #     Manage Actions access → add this repository with the Write role.
  # Or set the secrets GHCR_USERNAME / GHCR_TOKEN (a token with
  # write:packages) and the push uses those instead of GITHUB_TOKEN.
  docker:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Version
        id: v
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nhcx-adapter:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ steps.v.outputs.commit }}
            BUILT_AT=${{ steps.v.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The first-run path an operator takes: generate a key into the volume,
      # start serve, and expect /healthz from outside the container.
      - name: Smoke test
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id nhcx-adapter:ci -u)" = 10001
          docker run --rm nhcx-adapter:ci version
          cat > smoke.env <<'EOF'
          NHCX_PARTICIPANT_ID=1000000000@hcx
          NHCX_CLIENT_ID=ci
          NHCX_CLIENT_SECRET=ci
          NHCX_CALLBACK_URL=http://127.0.0.1:8765/nhcx/callback
          EOF
          docker volume create smoke
          docker run --rm --env-file smoke.env -v smoke:/data nhcx-adapter:ci cert generate
          docker run -d --name smoke --env-file smoke.env -v smoke:/data -p 8090:8090 \
            nhcx-adapter:ci serve --no-tui --skip-checks
          ok=
          for _ in $(seq 1 30); do
            if body="$(curl -fsS http://127.0.0.1:8090/healthz)"; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke
          docker rm -f smoke
          test -n "$ok"
          echo "$body"
          echo "$body" | grep -q '"version":"${{ steps.v.outputs.version }}"'
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le,linux/s390x,linux/riscv64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ steps.v.outputs.commit }}
            BUILT_AT=${{ steps.v.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every build lands on a GitHub release:
  #   - vX.Y.Z tag → release "nhcx-adapter vX.Y.Z" (image :X.Y.Z, :latest)
  #   - push to main → the rolling "edge" pre-release, deleted and recreated
  #     at the new commit each time (image :main). `update` ignores it: the
  #     tag is not a version.
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nhcx-adapter_*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      - name: Release name
        id: rel
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "image=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"
            echo "image=main" >> "$GITHUB_OUTPUT"
          fi
      - name: Release body
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          IMAGE: ${{ steps.rel.outputs.image }}
        run: |
          {
            if [ "$TAG" = edge ]; then
              echo "## nhcx-adapter edge (${GITHUB_SHA::7})"
              echo
              echo "Latest build of \`main\`, replaced on every push. Not a release: \`nhcx-adapter update\` never offers it. Use a \`vX.Y.Z\` release for production."
            else
              echo "## nhcx-adapter ${TAG}"
              echo
              echo "Stateless NHCX adapter — one binary, one config. Pick your platform, unpack, run \`./nhcx-adapter config edit\` then \`./nhcx-adapter serve\` (or \`serve-hidden\` / \`stop\` / \`update\` scripts from the archive). Already installed? \`nhcx-adapter update --to ${TAG}\`."
            fi
            echo
            echo "| Platform | Archive |"
            echo "| --- | --- |"
            for f in dist/*.tar.gz dist/*.zip; do
              base="$(basename "$f")"
              rest="${base#nhcx-adapter_*_}"
              os="${rest%%_*}"; arch="${rest#*_}"; arch="${arch%%.*}"
              case "$os" in
                linux)   os="Linux" ;;
                darwin)  os="macOS" ;;
                windows) os="Windows" ;;
                freebsd) os="FreeBSD" ;;
              esac
              case "$arch" in
                amd64) arch="x86-64" ;;
                arm64) arch="ARM64 (Apple silicon / Graviton)" ;;
                arm)   arch="ARMv7 (32-bit)" ;;
                386)   arch="x86 (32-bit)" ;;
                ppc64le) arch="POWER (ppc64le)" ;;
                s390x)   arch="IBM Z (s390x)" ;;
                riscv64) arch="RISC-V 64" ;;
              esac
              echo "| $os · $arch | \`$base\` |"
            done
            echo
            echo "Verify a download with \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo
            echo "Container image: \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${IMAGE}\` (linux/amd64, arm64, arm/v7, arm/v6, 386, ppc64le, s390x, riscv64)."
          } > body.md
          cat body.md
      - name: Publish
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          if [ "$TAG" = edge ]; then
            gh release delete edge --cleanup-tag --yes || true
            gh release create edge dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "nhcx-adapter edge" --notes-file body.md
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --verify-tag --title "nhcx-adapter ${TAG}" --notes-file body.md --generate-notes
          fi
