name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Vet, race tests, and a compile of every release target.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # git describe needs the tags
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make check
      - run: make compile-all

  # Package every platform. On ordinary pushes the archives are attached to
  # the workflow run (Actions → run → Artifacts); on a vX.Y.Z tag they go to
  # the release below.
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: nhcx-gateway-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # Tag vX.Y.Z (git tag v1.0.0 && git push --tags) to publish a GitHub
  # release with every archive and its checksum attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nhcx-gateway-${{ github.ref_name }}
          path: dist
      - name: Release body
        run: |
          {
            echo "## nhcx-gateway ${GITHUB_REF_NAME}"
            echo
            echo "Stateless NHCX adapter — one binary, one config. Pick your platform, unpack, run \`./nhcx-gateway config edit\` then \`./nhcx-gateway serve\`."
            echo
            echo "| Platform | Archive |"
            echo "| --- | --- |"
            for f in dist/*.tar.gz dist/*.zip; do
              base="$(basename "$f")"
              rest="${base#nhcx-gateway_${GITHUB_REF_NAME}_}"
              os="${rest%%_*}"; arch="${rest#*_}"; arch="${arch%%.*}"
              case "$os" in
                linux)   os="Linux" ;;
                darwin)  os="macOS" ;;
                windows) os="Windows" ;;
                freebsd) os="FreeBSD" ;;
              esac
              case "$arch" in
                amd64) arch="x86-64" ;;
                arm64) arch="ARM64 (Apple silicon / Graviton)" ;;
                arm)   arch="ARMv7 (32-bit)" ;;
                386)   arch="x86 (32-bit)" ;;
              esac
              echo "| $os · $arch | \`$base\` |"
            done
            echo
            echo "Verify a download with \`sha256sum -c SHA256SUMS --ignore-missing\`."
          } > body.md
          cat body.md
      - uses: softprops/action-gh-release@v2
        with:
          name: nhcx-gateway ${{ github.ref_name }}
          body_path: body.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
